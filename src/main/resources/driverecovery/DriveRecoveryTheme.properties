# FlatLaf Custom Dark Theme — Drive Recovery Tool

# ── Base Palette ─────────────────────────────────────────
@background       = #0D1117
@foreground       = #E6EDF3
@selectionBackground = #1F3A5F
@selectionForeground = #E6EDF3

@accent           = #58A6FF
@accentDarker     = #388BFD
@green            = #3FB950
@red              = #F85149
@yellow           = #E3B341
@purple           = #BC8CFF
@orange           = #F0883E

@panelBg          = #161B22
@componentBg      = #21262D
@inputBg          = #2D333B
@border           = #30363D
@borderFocus      = #58A6FF
@textMuted        = #8B949E
@textDim          = #6E7681

# ── Core Components ──────────────────────────────────────
[light]

# Override everything to our dark colors
*.background      = @background
*.foreground      = @foreground

# Panel
Panel.background  = @panelBg

# Text components
TextComponent.arc = 6
TextField.background    = @inputBg
TextField.foreground    = @foreground
TextField.border        = 4,8,4,8
TextArea.background     = @background
TextArea.foreground     = @foreground
TextPane.background     = @background
TextPane.foreground     = @foreground
FormattedTextField.background = @inputBg
FormattedTextField.foreground = @foreground
PasswordField.background = @inputBg
PasswordField.foreground = @foreground
Spinner.background      = @inputBg
Spinner.foreground      = @foreground

# Button
Button.arc                = 8
Button.background         = @componentBg
Button.foreground         = @textMuted
Button.hoverBackground    = #2D333B
Button.pressedBackground  = #21262D
Button.focusedBackground  = @componentBg
Button.borderColor        = @border
Button.hoverBorderColor   = #444C56
Button.focusedBorderColor = @accent
Button.defaultBackground  = @accentDarker
Button.defaultForeground  = #FFFFFF

# ToggleButton
ToggleButton.arc              = 8
ToggleButton.background       = @componentBg
ToggleButton.selectedBackground = @selectionBackground
ToggleButton.selectedForeground = @foreground

# CheckBox + RadioButton
CheckBox.icon.arc          = 4
CheckBox.icon.background   = @inputBg
CheckBox.icon.borderColor  = @border
CheckBox.icon.selectedBackground    = @accent
CheckBox.icon.checkmarkColor        = #FFFFFF
CheckBox.icon.hoverBackground       = @componentBg
CheckBox.icon.hoverBorderColor      = @accent
RadioButton.icon.arc        = 10
RadioButton.icon.background = @inputBg
RadioButton.icon.borderColor = @border
RadioButton.icon.selectedBackground = @accent

# ComboBox
ComboBox.background     = @inputBg
ComboBox.foreground     = @foreground
ComboBox.buttonBackground = @inputBg
ComboBox.arc            = 6

# TabbedPane
TabbedPane.background        = @componentBg
TabbedPane.foreground        = @textMuted
TabbedPane.selectedForeground = @foreground
TabbedPane.underlineColor    = @accent
TabbedPane.inactiveUnderlineColor = @border
TabbedPane.focusColor        = #00000000
TabbedPane.hoverColor        = #FFFFFF0A
TabbedPane.tabHeight         = 38
TabbedPane.tabArc            = 0
TabbedPane.tabInsets         = 0,18,0,18
TabbedPane.contentSeparatorHeight = 1

# Table
Table.background            = @background
Table.foreground            = @foreground
Table.selectionBackground   = @selectionBackground
Table.selectionForeground   = @foreground
Table.gridColor             = @componentBg
Table.rowHeight             = 30
Table.alternateRowColor     = #131820
TableHeader.background      = @componentBg
TableHeader.foreground      = @textMuted
TableHeader.separatorColor  = @border
TableHeader.height          = 32

# ScrollBar
ScrollBar.background        = @panelBg
ScrollBar.thumb             = #444C56
ScrollBar.hoverThumbColor   = #6E7681
ScrollBar.pressedThumbColor = @textMuted
ScrollBar.thumbArc          = 999
ScrollBar.thumbInsets       = 2,4,2,4
ScrollBar.width             = 10
ScrollBar.trackArc          = 0

# ProgressBar
ProgressBar.arc             = 999
ProgressBar.background      = @inputBg
ProgressBar.foreground      = @accent
ProgressBar.selectionForeground = @foreground
ProgressBar.selectionBackground = @accent

# Separator
Separator.foreground        = @border

# ToolTip
ToolTip.background          = @componentBg
ToolTip.foreground          = @foreground
ToolTip.border              = 6,10,6,10

# SplitPane
SplitPane.background        = @background
SplitPaneDivider.draggingColor = @accent

# PopupMenu
PopupMenu.background        = @componentBg
PopupMenu.border            = 1,1,1,1,@border,6
MenuItem.background         = @componentBg
MenuItem.foreground         = @foreground
MenuItem.selectionBackground = @selectionBackground
MenuItem.selectionForeground = @foreground

# OptionPane
OptionPane.background       = @panelBg
OptionPane.foreground       = @foreground
OptionPane.messageForeground = @foreground

# Focus ring
Component.focusColor        = @borderFocus
Component.focusWidth        = 2
Component.innerFocusWidth   = 0
Component.arc               = 6
